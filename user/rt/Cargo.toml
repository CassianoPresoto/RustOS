[package]
name = "rustos-user-rt"
description = "Runtime dos programas de usuário: entrada em Rust, pânico, alocador, auxv e syscalls seguras."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
bench = false

[lints]
workspace = true

[features]
# Syscalls com valores crus, só para `user/tests/*` (SDD 17).
raw-syscalls = []

[dependencies]
rustos-hal.workspace = true

[target.'cfg(target_os = "none")'.dependencies]
rustos-elf.workspace = true
rustos-cpio.workspace = true

[target.'cfg(all(target_os = "none", target_arch = "x86_64"))'.dependencies]
rustos-arch-x86_64-user.workspace = true

[target.'cfg(all(target_os = "none", target_arch = "aarch64"))'.dependencies]
rustos-arch-aarch64-user.workspace = true
