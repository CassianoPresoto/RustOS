[package]
name = "rustos-kernel"
description = "Raiz de composição: liga os adaptadores às portas do núcleo e gera o binário bootável."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "rustos"
path = "src/main.rs"
test = false
bench = false

[features]
# Endereços crus no log, no fault e no pânico (SDD 09). Fora do padrão: entrega o KASLR.
debug-addrs = []

[dependencies]
rustos-hal.workspace = true
rustos-mm.workspace = true
rustos-crypto.workspace = true
rustos-sched.workspace = true
rustos-gfx.workspace = true
rustos-term.workspace = true
rustos-shell.workspace = true
rustos-sync.workspace = true
rustos-boot-limine.workspace = true

[target.'cfg(target_arch = "x86_64")'.dependencies]
rustos-arch-x86_64.workspace = true
rustos-driver-uart16550.workspace = true
rustos-driver-i8042.workspace = true

[target.'cfg(target_arch = "aarch64")'.dependencies]
rustos-arch-aarch64.workspace = true
rustos-driver-pl011.workspace = true
rustos-driver-gicv3.workspace = true

[lints]
workspace = true
