[package]
name = "rustos-shell"
description = "Shell embutido: edição de linha, histórico e comandos do sistema."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[lib]
bench = false

[features]
# O comando `bench`. O kernel só a liga com a sua `selftest`; sem ela o comando diz que não
# está no build (SDD 05). Ligada por padrão para o `cargo test` do host cobrir o comando.
default = ["bench"]
bench = []

[lints]
workspace = true

[dependencies]
rustos-hal.workspace = true
